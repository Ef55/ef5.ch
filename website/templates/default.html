<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        $if(description)$
        <meta name="description" content="$description$">
        <meta name="robots" content="nosnippet, noimageindex, nofollow">
        $else$
        <meta name="robots" content="noindex, nosnippet, noimageindex, nofollow">
        $endif$

        <title>$siteName$ - $title$</title>

        <link rel="stylesheet" href="/css/default.css" />
        <link rel="stylesheet" href="/fonts/Iosevka-web/Iosevka-web.css" />
        <link rel="stylesheet" href="/icons/lucide/lucide.css" />
        <link rel="stylesheet" href="/icons/simple-icons/simple-icons.css" />
        $if(hasMath)$
        <link rel="stylesheet" href="/katex/katex.min.css" />
        $endif$
        <script src="/js/main.js" defer></script>
        $if(inlineCSS)$
        <style>$inlineCSS$</style>
        $endif$
    </head>
    <body>
        <header>
            <h1>
                <a tabindex="-1" href="/">$siteName$</a>
            </h1>
            <nav>
                <a href="/">/</a>
                <a href="/cv.html">CV</a>
                <div class="separator"></div>
                <a tabindex="0" onmouseover="setMailto(this)" onfocus="setMailto(this)" title="Allow scripts + hover/focus to reveal email" aria-label="Email"><span class="icon icon-mail"></span></a>
                <a href="https://github.com/Ef55" aria-label="GitHub"><span class="icon si-github"></span></a>
            </nav>
        </header>

        <main>
            $if(titleShown)$
            <h2>$title$</h2>
            $endif$
            $body$
        </main>

        <footer>
            Last update: $buildDate$
            <div class="separator"></div>
            <a href="$sourcesRepository$">Sources</a>
        </footer>
    </body>
</html>
